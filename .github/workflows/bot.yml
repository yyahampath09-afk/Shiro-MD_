name: WhatsApp Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: whatsapp-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Show Bot Banner
        run: |
          echo "  ███████╗██╗  ██╗██╗██████╗  ██████╗     ███╗   ███╗██████╗ "
          echo "  ██╔════╝██║  ██║██║██╔══██╗██╔═══██╗    ████╗ ████║██╔══██╗"
          echo "  ███████╗███████║██║██████╔╝██║   ██║    ██╔████╔██║██║  ██║"
          echo "  ╚════██║██╔══██║██║██╔══██╗██║   ██║    ██║╚██╔╝██║██║  ██║"
          echo "  ███████║██║  ██║██║██║  ██║╚██████╔╝    ██║ ╚═╝ ██║██████╔╝"
          echo "  ╚══════╝╚═╝  ╚═╝╚═╝╚═╝  ╚═╝ ╚═════╝     ╚═╝     ╚═╝╚═════╝ "
          echo "🚀 Starting SHIRO-MD Bot via GitHub Actions..."

            - name: Run Bot
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          WA_ANTIBAN_PRESET: 'conservative' # 👈 'conservative', 'moderate', හෝ 'aggressive'
          WA_ANTIBAN_MIN_DELAY: '1500'      # අවම delay එක (ms)
          WA_ANTIBAN_MAX_DELAY: '4000'      # උපරිම delay එක (ms)
        run: node pair.js